<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Re-Palette — 美容を、社会復帰のインフラへ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Zen+Kaku+Gothic+New:wght@300;400;700&display=swap');

  :root {
    --cream: #faf6f0;
    --ink: #1a1208;
    --gold: #c9a55a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--cream);
    cursor: none;
  }

  /* ── Custom cursor ── */
  #cursor {
    position: fixed; z-index: 9999;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--ink);
    pointer-events: none;
    transform: translate(-50%, -50%);
    mix-blend-mode: multiply;
    transition: transform .15s ease, width .2s ease, height .2s ease, background .2s;
  }
  #cursor.hover {
    width: 44px; height: 44px;
    background: rgba(201,165,90,.45);
  }

  /* ── Canvas layer ── */
  #bg-canvas {
    position: fixed; inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Loader ── */
  #loader {
    position: fixed; inset: 0; z-index: 1000;
    background: var(--cream);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 18px;
    transition: opacity .8s ease;
  }
  #loader-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: .18em;
    color: var(--ink);
    opacity: 0;
    animation: fadeUp .8s .3s forwards;
  }
  #loader-sub {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: .3em;
    color: var(--gold);
    opacity: 0;
    animation: fadeUp .8s .6s forwards;
  }
  #loader-bar {
    width: 180px; height: 1px;
    background: #e0d8cc;
    overflow: hidden;
    opacity: 0;
    animation: fadeUp .5s .9s forwards;
  }
  #loader-fill {
    height: 100%;
    background: var(--gold);
    width: 0;
    animation: loadFill 1.4s 1s ease forwards;
  }
  @keyframes loadFill { to { width: 100%; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Main wrapper ── */
  #site {
    position: fixed; inset: 0; z-index: 1;
    opacity: 0;
    transition: opacity .8s ease;
    overflow: hidden;
  }
  #site.visible { opacity: 1; }

  /* ── HERO ── */
  #hero {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    pointer-events: none;
    z-index: 2;
  }
  #hero-eyebrow {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: .45em;
    color: var(--gold);
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .7s, transform .7s;
    margin-bottom: 20px;
  }
  #hero-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 9vw, 110px);
    font-weight: 300;
    letter-spacing: .06em;
    color: var(--ink);
    line-height: 1;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity .8s .1s, transform .8s .1s;
  }
  #hero-dash {
    width: 60px; height: 1px;
    background: var(--gold);
    margin: 28px auto;
    opacity: 0;
    transform: scaleX(0);
    transform-origin: left;
    transition: opacity .6s .3s, transform .8s .3s;
  }
  #hero-sub {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: clamp(12px, 1.4vw, 15px);
    letter-spacing: .25em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(14px);
    transition: opacity .7s .5s, transform .7s .5s;
    text-align: center;
  }
  #hero.in .hero-el {
    opacity: 1 !important;
    transform: translateY(0) scaleX(1) !important;
  }


  /* ── Palette nav marquee ── */
  #palette-nav {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    overflow: hidden;
    padding-bottom: 0;
    z-index: 3;
    mask-image: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, black 10%, black 90%, transparent 100%);
    opacity: 0;
    transition: opacity .6s;
  }
  #palette-nav.in { opacity: 1; }

  #belt-wrapper {
    display: flex;
    width: max-content;
    align-items: flex-end;
  }
  #belt-wrapper.running {
    animation: beltRoll var(--dur, 20s) linear infinite;
  }
  @keyframes beltRoll {
    from { transform: translateX(0); }
    to   { transform: translateX(calc(-1 * var(--set-w, 50%))); }
  }
  .marquee-set {
    display: flex;
    align-items: flex-end;
    padding-bottom: 48px;
    gap: clamp(14px, 3vw, 36px);
    flex-shrink: 0;
  }

  .paint-tube {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: none;
    gap: 10px;
    flex-shrink: 0;
  }
  .paint-tube:hover .tube-body  { transform: translateY(-14px) rotate(-5deg) scale(1.1); }
  .paint-tube:hover .tube-label { opacity: 1; transform: translateY(0); }

  .tube-body {
    width: clamp(36px, 5vw, 52px);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    filter: drop-shadow(0 8px 22px rgba(0,0,0,.13));
  }
  .tube-label {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    letter-spacing: .25em;
    color: var(--ink);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .3s, transform .3s;
    white-space: nowrap;
    text-align: center;
  }

  /* ── Section overlay ── */
  #section-overlay {
    position: fixed; inset: 0; z-index: 50;
    pointer-events: none;
    transition: opacity .5s;
    opacity: 0;
    overflow: hidden;
  }
  #section-overlay.open {
    pointer-events: all;
    opacity: 1;
  }

  /* Full-screen panel split layout */
  #sec-panel {
    position: absolute; inset: 0;
    display: grid;
    grid-template-columns: 1fr 1.45fr;
    height: 100%;
    transform: translateY(100%);
    transition: transform .65s cubic-bezier(.16,1,.3,1);
  }
  #section-overlay.open #sec-panel {
    transform: translateY(0);
  }

  /* LEFT — color slab */
  #sec-left {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: clamp(28px,5vw,64px);
    padding-top: clamp(60px,8vw,90px);
    overflow: hidden;
  }
  #sec-left-bg {
    position: absolute; inset: 0;
    transition: background .3s;
  }
  #sec-left-label {
    position: absolute;
    top: clamp(20px,3vw,36px);
    left: clamp(20px,3vw,36px);
    z-index: 3;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .35em;
    color: rgba(255,255,255,.9);
    text-transform: uppercase;
  }
  #sec-big-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(100px,18vw,220px);
    font-weight: 300;
    line-height: .85;
    color: rgba(255,255,255,.13);
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    letter-spacing: -.02em;
  }
  #sec-left-icon {
    position: relative; z-index: 2;
    margin-bottom: 24px;
  }
  #sec-left-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(26px,4vw,48px);
    font-weight: 300;
    color: #fff;
    line-height: 1.2;
    position: relative; z-index: 2;
    margin-bottom: 16px;
  }
  #sec-left-eyebrow {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    letter-spacing: .45em;
    color: rgba(255,255,255,.65);
    position: relative; z-index: 2;
    margin-bottom: 32px;
  }
  #sec-paint-blob {
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    pointer-events: none;
  }
  #sec-paint-blob2 {
    position: absolute;
    bottom: -100px; left: -60px;
    width: 260px; height: 260px;
    border-radius: 60% 40% 55% 45% / 45% 55% 45% 55%;
    background: rgba(255,255,255,.05);
    pointer-events: none;
  }

  /* RIGHT — content */
  #sec-right {
    background: #faf6f0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(28px,5vw,72px) clamp(28px,5vw,60px);
    overflow-y: auto;
    position: relative;
  }
  #sec-right::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 1px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.08) 30%, rgba(0,0,0,.08) 70%, transparent);
  }

  .sec-eyebrow {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    letter-spacing: .45em;
    color: var(--gold);
    margin-bottom: 20px;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity .5s .35s, transform .5s .35s;
  }
  #section-overlay.open .sec-eyebrow { opacity:1; transform:translateX(0); }

  .sec-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(22px, 3.2vw, 38px);
    font-weight: 300;
    color: var(--ink);
    margin-bottom: 8px;
    line-height: 1.25;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s .42s, transform .5s .42s;
  }
  #section-overlay.open .sec-title { opacity:1; transform:translateY(0); }

  .sec-divider {
    height: 2px;
    border-radius: 2px;
    margin: 20px 0 24px;
    width: 0;
    transition: width .7s .5s ease;
  }
  #section-overlay.open .sec-divider { width: 100%; }

  .sec-body {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 13.5px;
    line-height: 2;
    color: #3a2e20;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .55s, transform .5s .55s;
  }
  #section-overlay.open .sec-body { opacity:1; transform:translateY(0); }

  /* stat cards */
  .sec-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px,1fr));
    gap: 10px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .62s, transform .5s .62s;
  }
  #section-overlay.open .sec-stats { opacity:1; transform:translateY(0); }
  .stat-card {
    border-radius: 8px;
    padding: 14px 12px;
    text-align: center;
  }
  .stat-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(20px, 2.5vw, 28px);
    font-weight: 400;
    line-height: 1;
    margin-bottom: 6px;
  }
  .stat-label {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 9px;
    letter-spacing: .2em;
    color: #6a5a48;
    line-height: 1.5;
  }

  /* flow steps */
  .sec-flow {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .62s, transform .5s .62s;
  }
  #section-overlay.open .sec-flow { opacity:1; transform:translateY(0); }
  .flow-step {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 8px;
    background: rgba(0,0,0,.03);
  }
  .flow-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 300;
    line-height: 1;
    flex-shrink: 0;
    width: 28px;
    text-align: right;
  }
  .flow-text {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.8;
    color: #3a2e20;
  }
  .flow-text strong {
    font-weight: 700;
    display: block;
    font-size: 11px;
    letter-spacing: .1em;
    margin-bottom: 2px;
  }

  /* ecosystem */
  .sec-ecosystem {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .62s, transform .5s .62s;
  }
  #section-overlay.open .sec-ecosystem { opacity:1; transform:translateY(0); }
  .eco-node {
    border-radius: 10px;
    padding: 16px 10px;
    text-align: center;
  }
  .eco-icon { margin-bottom: 10px; display: flex; justify-content: center; }
  .eco-title { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 11px; font-weight: 700; color: var(--ink); margin-bottom: 4px; letter-spacing: .08em; }
  .eco-desc  { font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 10px; font-weight: 300; color: #6a5a48; line-height: 1.6; }

  /* vision quote */
  .sec-quote {
    border-left: 3px solid;
    padding: 14px 18px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 28px;
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(14px,1.6vw,18px);
    font-style: italic;
    font-weight: 300;
    color: var(--ink);
    line-height: 1.8;
    background: rgba(0,0,0,.03);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .62s, transform .5s .62s;
  }
  #section-overlay.open .sec-quote { opacity:1; transform:translateY(0); }

  /* contact CTA */
  .sec-cta {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity .5s .62s, transform .5s .62s;
  }
  #section-overlay.open .sec-cta { opacity:1; transform:translateY(0); }
  .cta-chip {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 8px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px;
    font-weight: 300;
    color: var(--ink);
    border: 1px solid rgba(0,0,0,.1);
  }
  .cta-chip-icon { flex-shrink: 0; display: flex; align-items: center; }

  .sec-close {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    letter-spacing: .35em;
    color: var(--ink);
    cursor: none;
    background: none; border: none;
    padding: 10px 0;
    opacity: 0;
    transition: opacity .4s .7s;
  }
  #section-overlay.open .sec-close { opacity: 1; }
  .sec-close::before {
    content: '';
    display: block;
    width: 28px; height: 1px;
    background: var(--ink);
    transition: width .3s;
  }
  .sec-close:hover::before { width: 52px; }

  /* ── Paint splash particles ── */
  .splash {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    animation: splashAnim .7s ease forwards;
  }
  @keyframes splashAnim {
    0%   { transform: scale(0) translate(0,0); opacity: .9; }
    60%  { opacity: .7; }
    100% { transform: scale(1) translate(var(--tx), var(--ty)); opacity: 0; }
  }

  /* ── Ink drip top accent ── */
  #drip-bar {
    position: fixed; top: 0; left: 0; right: 0; height: 4px;
    z-index: 5;
    display: flex;
  }
  .drip-seg {
    flex: 1;
    position: relative;
    opacity: 0;
    transform: scaleY(0);
    transform-origin: top;
    transition: opacity .4s, transform .4s;
  }
  .drip-seg.in { opacity: 1; transform: scaleY(1); }
  .drip-seg::after {
    content: '';
    position: absolute;
    bottom: -14px; left: 50%;
    transform: translateX(-50%);
    width: 6px; height: 14px;
    border-radius: 0 0 6px 6px;
    background: inherit;
  }

  /* ── Top nav ── */
  #top-nav {
    position: fixed; top: 28px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 clamp(24px, 5vw, 60px);
    z-index: 10;
    opacity: 0;
    transition: opacity .6s;
  }
  #top-nav.in { opacity: 1; }
  .nav-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    letter-spacing: .18em;
    color: var(--ink);
    font-style: italic;
  }
  .nav-tagline {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px;
    letter-spacing: .3em;
    color: var(--gold);
    font-weight: 300;
  }

  /* ── Hint text ── */
  #hint {
    position: fixed;
    bottom: 32px; right: clamp(20px, 4vw, 48px);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 9px;
    letter-spacing: .35em;
    color: #b8a898;
    z-index: 5;
    opacity: 0;
    transition: opacity .6s 1.5s;
    writing-mode: vertical-rl;
  }
  #hint.in { opacity: 1; }

  /* ── Footer ── */
  #site-footer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(24px,5vw,60px) 22px;
    opacity: 0;
    transition: opacity .6s;
    pointer-events: none;
  }
  #site-footer.in { opacity: 1; pointer-events: all; }
  .footer-left { display: flex; align-items: center; gap: 28px; }
  .footer-item {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px; font-weight: 300; letter-spacing: .18em;
    color: #8a7a6a; white-space: nowrap;
  }
  .footer-item svg { opacity: .55; flex-shrink: 0; }
  .footer-divider { width: 1px; height: 14px; background: #c8bfb4; }
  .footer-copy {
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px; letter-spacing: .15em; color: #b0a090; font-style: italic;
  }

  /* ── Contact page rich styles ── */
  .con-partner-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s .55s, transform .5s .55s;
  }
  #section-overlay.open .con-partner-grid { opacity:1; transform:translateY(0); }
  .con-partner-card {
    border-radius: 12px;
    padding: 18px 12px 14px;
    text-align: center;
    border: 1px solid rgba(155,89,204,.2);
    background: rgba(155,89,204,.06);
    transition: background .3s, transform .3s;
    cursor: none;
  }
  .con-partner-card:hover {
    background: rgba(155,89,204,.13);
    transform: translateY(-4px);
  }
  .con-partner-icon {
    display: flex; justify-content: center;
    margin-bottom: 10px;
  }
  .con-partner-name {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: .12em;
    color: var(--ink); margin-bottom: 5px;
  }
  .con-partner-desc {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px; font-weight: 300; color: #7a6a8a; line-height: 1.6;
  }

  .con-info-row {
    display: flex; flex-direction: column; gap: 8px;
    margin-bottom: 20px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s .68s, transform .5s .68s;
  }
  #section-overlay.open .con-info-row { opacity:1; transform:translateY(0); }
  .con-info-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: 8px;
    background: rgba(155,89,204,.05);
    border: 1px solid rgba(155,89,204,.12);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 12px; font-weight: 300; color: var(--ink);
    letter-spacing: .1em;
  }
  .con-info-label {
    font-size: 9px; letter-spacing: .3em;
    color: #9b59cc; font-weight: 300;
    min-width: 56px;
  }
  .con-info-val {
    font-family: 'Cormorant Garamond', sans-serif;
    font-size: 13px; color: #2a1a3a;
  }

  .con-sns-row {
    display: flex; gap: 10px; margin-bottom: 20px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .5s .75s, transform .5s .75s;
  }
  #section-overlay.open .con-sns-row { opacity:1; transform:translateY(0); }
  .con-sns-btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid rgba(155,89,204,.2);
    background: rgba(155,89,204,.06);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-size: 10px; letter-spacing: .18em; color: #6a3a9a; font-weight: 300;
    cursor: none; transition: background .3s, transform .3s;
  }

class Blob {
  constructor(i) {
    this.x  = Math.random() * canvas.width;
    this.y  = Math.random() * canvas.height;
    this.r  = Math.random() * 120 + 60;
    this.vx = (Math.random() - .5) * .35;
    this.vy = (Math.random() - .5) * .35;
    this.color = COLORS[i % COLORS.length];
    this.alpha = Math.random() * .09 + .04;
    this.phase = Math.random() * Math.PI * 2;
    this.wobble = Math.random() * .015 + .008;
  }
  draw(t) {
    const p = this.phase + t * this.wobble;
    ctx.save();
    ctx.translate(this.x, this.y);
    const grad = ctx.createRadialGradient(0,0,0,0,0,this.r);

    if (this.x > canvas.width + this.r*2) this.x = -this.r;
    if (this.y < -this.r*2) this.y = canvas.height + this.r;
    if (this.y > canvas.height + this.r*2) this.y = -this.r;
  }
}

function buildBelt() {
  // Two identical belts side by side — JS measures actual width after render
  // then sets animation duration so speed is constant regardless of screen width
  const beltA = document.createElement('div');
  const beltB = document.createElement('div');
  beltA.className = 'marquee-set';
  beltB.className = 'marquee-set';

  // Enough tubes to always overflow: repeat 6-tube set 6 times per half
  const repeat = 6;
  for (let r = 0; r < repeat; r++) {
    SECTIONS.forEach(sec => {
      beltA.appendChild(makeTube(sec));
      beltB.appendChild(makeTube(sec));
    });
  }

  const wrapper = document.createElement('div');
  wrapper.id = 'belt-wrapper';
  wrapper.appendChild(beltA);
  wrapper.appendChild(beltB);
  paletteNav.appendChild(wrapper);

  // After render: measure one set, then animate translateX(-setWidth) at constant speed
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const setW = beltA.offsetWidth;
      const speed = 70; // px per second
      const dur = setW / speed;
      wrapper.style.setProperty('--set-w', setW + 'px');
      wrapper.style.setProperty('--dur', dur + 's');
      wrapper.classList.add('running');
    });
  });
}

    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }

// ─────────────────────────────────
// SECTION OVERLAY
// ─────────────────────────────────
const overlay    = document.getElementById('section-overlay');
const secContent = document.getElementById('section-content');

function openSection(sec) {
  spawnSplash(sec.color, 12);
  document.getElementById('sec-left-label').textContent = sec.label;
  document.getElementById('sec-left-bg').style.background = `linear-gradient(145deg, ${sec.color}, ${sec.dark})`;
  document.getElementById('sec-big-num').textContent = sec.eyebrow.split(' ')[0];
  document.getElementById('sec-left-eyebrow').textContent = sec.eyebrow;
  document.getElementById('sec-left-icon').innerHTML = `<svg viewBox="0 0 60 60" width="56" height="56" xmlns="http://www.w3.org/2000/svg">${tubeSVGMini(sec.color)}</svg>`;
  document.getElementById('sec-left-title').innerHTML = sec.title.replace(/\n/g,'<br>');
  secContent.innerHTML = buildSectionInner(sec);
  overlay.classList.add('open');
  const btn = document.getElementById('sec-close-btn');
  btn.addEventListener('click', closeSection);
  btn.addEventListener('mouseenter', () => setCursorHover(true));
  btn.addEventListener('mouseleave', () => setCursorHover(false));
}

function closeSection() { overlay.classList.remove('open'); }

overlay.addEventListener('click', e => { if (e.target === overlay) closeSection(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSection(); });

// ─────────────────────────────────
// INIT
// ─────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => {
      loader.style.display = 'none';
      document.getElementById('site').classList.add('visible');
      requestAnimationFrame(() => document.getElementById('hero').classList.add('in'));
      document.getElementById('top-nav').classList.add('in');
      document.getElementById('hint').classList.add('in');
      document.getElementById('site-footer').classList.add('in');
      setTimeout(() => paletteNav.classList.add('in'), 500);
      document.querySelectorAll('.drip-seg').forEach((el, i) => {
        setTimeout(() => el.classList.add('in'), 600 + i * 60);
      });
    }, 800);
  }, 2200);
});
</script>
